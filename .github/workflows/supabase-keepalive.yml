name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 10 */3 * *'  # a cada 3 dias, às 10h UTC
  workflow_dispatch:         # permite rodar manualmente se precisar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Supabase respondeu com status inesperado: $STATUS"
            exit 1
          fi
          echo "Supabase ativo."
